name: Setup Rust
description: Install Rust toolchain with caching and lld linker

inputs:
  components:
    description: Comma-separated list of components to install
    default: clippy, rustfmt

runs:
  using: composite
  steps:
    - name: Install lld linker
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y lld

    - name: Create swap space
      shell: bash
      run: |
        sudo fallocate -l 10G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        free -h

    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6
      with:
        toolchain: '1.95.0'
        components: ${{ inputs.components }}
        cache: true
        cache-on-failure: true
