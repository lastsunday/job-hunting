name: Setup mdBook
description: Install mdBook and mdbook-mermaid with caching

runs:
  using: composite
  steps:
    - name: Install mdbook
      uses: peaceiris/actions-mdbook@ee6f822a157334f7a0d22bf0fb1d2ede6513d040 # v2.0.2
      with:
        mdbook-version: latest

    - name: Cache mdbook-mermaid
      id: cache-mermaid
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          ~/.cargo/bin/mdbook-mermaid
          ~/.cargo/.crates2.json
          ~/.cargo/.crates.toml
        key: ${{ runner.os }}-mdbook-mermaid-v1

    - name: Install mdbook-mermaid
      if: steps.cache-mermaid.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install mdbook-mermaid
