name: server-release
run-name: ${{ github.actor }} server release

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

on:
  push:
    tags:
      - "job-hunting-server@*"

env:
  CARGO_TERM_COLOR: always
  ROOT_DIR: apps/server/
  REGISTRY: ghcr.io
  USER_NAME: lastsunday
  IMAGE_NAME: job-hunting
  BIN_NAME: job-hunting-server

jobs:
  create-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.ROOT_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Extract changelog
        run: |
          awk '/^##[^#]/{print NR}' CHANGELOG.md \
            | head -n 2 | xargs | tr ' ' ',' \
            | xargs -I {} sed -n {}p CHANGELOG.md \
            | sed '$d' > /tmp/CHANGELOG.txt

      - name: Create Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda
        with:
          body_path: /tmp/CHANGELOG.txt
          make_latest: false

  build-assets:
    needs: create-release
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.ROOT_DIR }}
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            targetOSAndARCH: linux-arm64
          - target: aarch64-apple-darwin
            os: macos-latest
            targetOSAndARCH: macos-arm64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            targetOSAndARCH: linux-amd64
          - target: x86_64-apple-darwin
            os: macos-latest
            targetOSAndARCH: macos-amd64
          - target: universal-apple-darwin
            os: macos-latest
            targetOSAndARCH: macos
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            targetOSAndARCH: window-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@22423f01bde48fb88785c007e3166fbbbd8e892a
        if: contains(matrix.os, 'windows')
        with:
          perl-version: "5.38"
          distribution: strawberry

      - name: Set Perl environment variables
        shell: powershell
        working-directory: \
        if: runner.os == 'Windows'
        run: |
          echo "PERL=$((where.exe perl)[0])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "OPENSSL_SRC_PERL=$((where.exe perl)[0])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set VERSION
        run: |
          echo "VERSION=${GITHUB_REF_NAME#job-hunting-server@}" >> $GITHUB_ENV

      - uses: ./.github/actions/setup-pnpm

      - name: Build UI
        run: |
          pnpm exec nx run @job-hunting/server-ui:build

      - name: Move UI dist to web/
        run: |
          rm -rf ./web/dist
          mv ../server-ui/dist ./web/dist

      - uses: taiki-e/upload-rust-binary-action@3962470d6e7f1993108411bc3f75a135ec67fc8c
        with:
          bin: ${{ env.BIN_NAME }}
          archive: $bin-${{ env.VERSION }}-$target
          target: ${{ matrix.target }}
          token: ${{ secrets.GITHUB_TOKEN }}
          manifest-path: Cargo.toml
          features: vendored-openssl

      - name: Rename bin for artifact
        if: matrix.target != 'x86_64-pc-windows-msvc'
        run: |
          mv ${{ github.workspace }}/dist/target/${{ matrix.target }}/release/${{ env.BIN_NAME }} \
             ${{ github.workspace }}/dist/target/${{ matrix.target }}/release/${{ env.BIN_NAME }}-${{ matrix.targetOSAndARCH }}

      - name: Upload artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        if: matrix.target != 'x86_64-pc-windows-msvc'
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.targetOSAndARCH }}
          path: ${{ github.workspace }}/dist/target/${{ matrix.target }}/release/${{ env.BIN_NAME }}-${{ matrix.targetOSAndARCH }}

  push-docker:
    needs: build-assets
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.ROOT_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Download binaries
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          path: ${{ env.IMAGE_NAME }}
          pattern: ${{ env.BIN_NAME }}-*
          merge-multiple: true

      - name: Move & chmod
        run: |
          mv ${{ env.IMAGE_NAME }}/* ./
          chmod 755 ${{ env.BIN_NAME }}-*

      - name: Set up QEMU
        uses: docker/setup-qemu-action@27d0a4f181a40b142cce983c5393082c365d1480

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f211e3e9ded2d9377c8cadc4489a4e38014bc4c9

      - name: Login to Docker Hub
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to ghcr.io
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: |
            ${{ env.USER_NAME }}/${{ env.IMAGE_NAME }}
            ghcr.io/${{ env.USER_NAME }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker images
        id: push
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: ${{ env.ROOT_DIR }}
          platforms: |
            linux/amd64
            linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.USER_NAME }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
