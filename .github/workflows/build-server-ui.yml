name: build-server-ui
run-name: ${{ github.actor }} server ui build
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
env:
  ROOT_DIR: apps/server-ui/

permissions:
  contents: write

jobs:
  build-server-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        name: Install pnpm
        with:
          version: 10.5.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: |
          pnpm exec nx run @job-hunting/server-ui:test

      - name: Build server ui
        run: |
          pnpm exec nx run @job-hunting/server-ui:build

      - name: Setup e2e tests
        run: |
          pnpm exec nx run @job-hunting/server-ui-e2e:e2e:install

      - name: Run e2e tests
        run: |
          pnpm exec nx run @job-hunting/server-ui-e2e:e2e
