name: ci
run-name: ${{ github.actor }} CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to run against
        default: dev
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  merge_group:
    branches: [dev]

jobs:
  nx-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - uses: ./.github/actions/setup-pnpm

      - name: Typecheck & unit tests (affected)
        run: pnpm exec nx affected -t typecheck test --base=origin/${{ github.base_ref || 'dev' }}

      - name: Check affected projects
        id: affected
        run: |
          PROJECTS=$(pnpm exec nx show projects --affected --base=origin/${{ github.base_ref || 'dev' }} | tr '\n' ' ')
          echo "projects=$PROJECTS" >> $GITHUB_OUTPUT
          if echo "$PROJECTS" | grep -q '@job-hunting/extension'; then
            echo "extension=true" >> $GITHUB_OUTPUT
          else
            echo "extension=false" >> $GITHUB_OUTPUT
          fi
          if echo "$PROJECTS" | grep -q '@job-hunting/server-ui-e2e'; then
            echo "server-ui-e2e=true" >> $GITHUB_OUTPUT
          else
            echo "server-ui-e2e=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Playwright (extension)
        if: steps.affected.outputs.extension == 'true'
        run: pnpm exec nx run @job-hunting/extension:test:e2e:install

      - name: Run extension e2e tests
        id: extension-e2e
        if: steps.affected.outputs.extension == 'true'
        run: pnpm exec nx run @job-hunting/extension:test:e2e

      - name: Install Playwright (server-ui-e2e)
        if: steps.affected.outputs.server-ui-e2e == 'true'
        run: pnpm exec nx run @job-hunting/server-ui-e2e:e2e:install

      - name: Run server-ui e2e tests
        if: steps.affected.outputs.server-ui-e2e == 'true'
        run: pnpm exec nx run @job-hunting/server-ui-e2e:e2e

      - name: (allure-report) Load test report history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: ${{ steps.affected.outputs.extension == 'true' && !cancelled() }}
        continue-on-error: true
        with:
          ref: gh-test
          path: gh-test
          fetch-depth: 1

      - name: (allure-report) Build test report
        uses: simple-elf/allure-report-action@53ebb757a2097edc77c53ecef4d454fc2f2f774c
        if: ${{ steps.affected.outputs.extension == 'true' && !cancelled() }}
        with:
          gh_pages: gh-test
          allure_history: gh-test
          allure_results: apps/extension/allure-results

      - name: (allure-report) Upload test report to action artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        if: ${{ steps.affected.outputs.extension == 'true' && !cancelled() }}
        with:
          name: extension-e2e-tests-allure-report
          path: allure-report/
          retention-days: 30

      - name: (cucumber-report) Upload test report to action artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        if: ${{ steps.affected.outputs.extension == 'true' && !cancelled() }}
        with:
          name: extension-e2e-tests-cucumber-report
          path: apps/extension/cucumber-report/
          retention-days: 30

  server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Check if server changed
        id: changed
        run: |
          BASE=origin/${{ github.base_ref || 'dev' }}
          CHANGED=$(git diff --name-only "$BASE" HEAD -- apps/server/ .github/ Cargo.* rust-toolchain.toml)
          if [ -n "$CHANGED" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - uses: ./.github/actions/setup-rust
        if: steps.changed.outputs.changed == 'true'

      - name: Run tests
        if: steps.changed.outputs.changed == 'true'
        run: |
          cargo test --workspace --exclude job-hunting-server --exclude web --verbose
          cargo clippy --workspace --exclude job-hunting-server --exclude web -- -D warnings
          cargo fmt --check

  docs-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref || github.ref }}

      - uses: ./.github/actions/setup-mdbook

      - name: Run tests
        run: |
          cd docs
          mdbook test

  docs-deploy:
    if: github.event_name != 'pull_request'
    needs: docs-test
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref || github.ref }}

      - uses: ./.github/actions/setup-mdbook

      - name: Build docs
        run: |
          cd docs
          mdbook build

      - name: Deploy GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/book
          publish_branch: gh-pages
          force_orphan: true
