name: codeql

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - "apps/server/**"
      - "apps/extension/**"
      - "libs/**"
      - ".github/**"
  pull_request:
    branches:
      - dev
    paths:
      - "apps/server/**"
      - "apps/extension/**"
      - "libs/**"
      - ".github/**"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - rust

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          packs: ${{ matrix.language == 'rust' && 'codeql/rust-queries' || '' }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
