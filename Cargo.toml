[workspace]
resolver = '2'
members = ['apps/server']

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["lastsunday"]

[workspace.dependencies]
axum = "0.8.9"
tokio = "1.52.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-error = "0.2.1"
config = "0.15.23"
serde = "1.0.228"
anyhow = "1.0.102"
sea-orm = "2.0.0-rc.38"
sea-orm-migration = "2.0.0-rc.38"
thiserror = "2.0.18"
tower-http = "0.6.11"
xid = "1.1.1"
idgenerator = "2.0.0"
bytesize = "2.3.1"
validator = "0.20.0"
axum-valid = "0.24.0"
regex = "1.12.3"
bcrypt = "0.19.1"
jsonwebtoken = "10.4.0"
utoipa = "5.5.0"
utoipa-axum = "0.2.0"
utoipa-scalar = "0.3.0"
serde_json = "1.0.150"
http-body-util = "0.1.3"
mime = "0.3.17"
chrono = "0.4.44"
testcontainers = "0.27.3"
testcontainers-modules = "0.15.0"
strum = "0.28.0"
strum_macros = "0.28.0"
futures = "0.3.32"
gix-packetline = "0.21.4"
gix-hash = "0.25.1"
gix-object = "0.61.0"
gix-pack = { version = "0.71.0", features = ["sha1"] }
gix-features = "0.48.1"
openssl = "0.10.80"
uuid = "1.23.1"
async-std = "1.13.2"
num_cpus = "1.17.0"
rust-embed = "8.11.0"
git2 = "0.21.0"
ssh-key = "0.6.7"
calamine = "0.35.0"
sha2 = "0.11.0"
hex = "0.4.3"
base64 = "0.22.1"
zip = "8.6.0"
cron = "0.16.0"
proc-macro2 = "1.0.106"
quote = "1.0.45"
syn = "2.0.117"
tower = "0.5.3"
cucumber = "0.23.0"
mockall = "0.14.0"
reqwest = "0.13.4"

[profile.dev]
opt-level = 1

[profile.test]
# speed up test case (special for llm) 
opt-level = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 8
strip = true
debug = false
