language: "typescript"
layer: "application"
tags: ["chrome-extension"]

tasks:
  bump:
    script: |
      bash ../../scripts/bump.sh \
        "@job-hunting/extension" \
        "package.json" \
        "--include-path apps/extension/** --include-path libs/analysis/**"
    options:
      runInCI: false

  ensure-deps:
    command: "pnpm install"
    inputs:
      - "/pnpm-lock.yaml"
      - "/pnpm-workspace.yaml"
      - "package.json"
    outputs:
      - "node_modules"
    options:
      cache: true

  build:
    command: "pnpm"
    args: ["run", "build"]
    deps:
      - ~:ensure-deps
      - analysis:build

  build-firefox:
    command: "pnpm"
    args: ["run", "build:firefox"]
    deps:
      - ~:ensure-deps
      - analysis:build

  test-unit:
    command: "pnpm"
    args: ["run", "test:unit"]
    deps:
      - ~:ensure-deps

  compile:
    command: "pnpm"
    args: ["run", "compile"]
    options:
      runInCI: true

  zip:
    command: "pnpm"
    args: ["run", "zip"]
    options:
      runInCI: true

  zip-firefox:
    command: "pnpm"
    args: ["run", "zip:firefox"]
    options:
      runInCI: true

  install-playwright:
    command: "pnpm exec playwright install --with-deps"
    options:
      cache: false
      mutex: "playwright-install"

  test-e2e:
    deps:
      - ~:build
      - ~:install-playwright
