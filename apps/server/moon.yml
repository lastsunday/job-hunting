language: 'rust'
tags: ['backend']

tasks:
  format:
    command: 'cargo fmt --check'

  check:
    command: 'cargo check --package job-hunting-server --no-default-features'

  build:
    command: 'cargo build --package job-hunting-server --no-default-features'
    outputs: ['dist/target/job-hunting-server']
    deps:
      - ~:check

  build-release:
    command: 'cargo build --release --package job-hunting-server --no-default-features'
    outputs: ['dist/target/job-hunting-server']
    deps:
      - ~:check

  lint:
    command: 'cargo clippy --workspace --exclude web -- -D warnings'
    deps:
      - ~:check

  test:
    command: 'cargo test --package job-hunting-server --no-default-features'
    deps:
      - ~:build

  run:
    command: 'cargo run --package job-hunting-server -- --config=application.toml'
    options:
      persistent: true
      cache: false

  dev:
    command: 'cargo run --package job-hunting-server -- --config=application-dev.toml'
    options:
      persistent: true
      cache: false
