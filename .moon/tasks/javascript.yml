inheritedBy:
  toolchains: ['javascript', 'typescript']

fileGroups:
  js-shared:
    - '/package.json'
    - '/pnpm-lock.yaml'
    - '/pnpm-workspace.yaml'

tasks:
  ensure-deps:
    command: 'pnpm install'
    inputs:
      - '/pnpm-lock.yaml'
      - '/pnpm-workspace.yaml'
      - 'package.json'
    outputs:
      - '/node_modules'
    options:
      cache: true
      mutex: 'pnpm-install'
